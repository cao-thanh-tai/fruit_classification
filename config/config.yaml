data:
  train_dir: data/raw/train
  test_dir: data/raw/test

training:
  model: resnet18
  pretrained: true
  image_size: 224
  validation_ratio: 0.2
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_factor: 0.1
  scheduler_patience: 2
  early_stopping_patience: 5
  mixed_precision: true
  resume: false
  seed: 42
  num_workers: 2